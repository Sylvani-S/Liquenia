<svg width="600" height="150" viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node { fill: #222; stroke: #0ff; stroke-width: 2; }
    .text { fill: white; font-family: monospace; font-size: 14px; text-anchor: middle; }
    .arrow { stroke: #555; stroke-width: 2; fill: #555; }
  </style>
  
  <rect x="20" y="50" width="100" height="50" rx="5" class="node" />
  <text x="70" y="80" class="text">Density (ρ)</text>
  
  <line x1="120" y1="75" x2="160" y2="75" class="arrow" />
  <polygon points="170,75 160,70 160,80" class="arrow" />
  
  <rect x="170" y="50" width="100" height="50" rx="5" class="node" />
  <text x="220" y="80" class="text">Potential (FFT)</text>
  
  <line x1="270" y1="75" x2="310" y2="75" class="arrow" />
  <polygon points="320,75 310,70 310,80" class="arrow" />

  <rect x="320" y="50" width="100" height="50" rx="5" class="node" />
  <text x="370" y="80" class="text">Force (Grad)</text>
  
  <line x1="420" y1="75" x2="460" y2="75" class="arrow" />
  <polygon points="470,75 460,70 460,80" class="arrow" />

  <rect x="470" y="50" width="100" height="50" rx="5" class="node" />
  <text x="520" y="80" class="text">Advection</text>
  
  <path d="M 520 50 Q 520 10 270 10 Q 70 10 70 50" fill="none" class="arrow" stroke-dasharray="5,5" />
  <polygon points="70,50 65,40 75,40" class="arrow" />
</svg>
