[project]
name = "smooth-particle-life"
version = "0.1.0"
description = "A Multi-State Smooth Life simulation optimized for CuPy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cupy-cuda12x>=14.0.0",
    "pygame>=2.6.0",
    "numpy>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
